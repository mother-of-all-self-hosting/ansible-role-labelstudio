---
# The checks that every Label Studio scenario shares. What differs between the
# scenarios is where the data is expected to land, and that is asserted by the
# scenario's own verify.yml after this file has run.
#
# The shape of the round trip below was settled by running the image by hand
# first, so that every assertion is known to be capable of failing:
#
# - Label Studio is a Django application, and a Django login page renders
#   perfectly well with the database unreachable. `GET /` returning something is
#   therefore worth nothing on its own, which is why the un-reachable-database
#   control below exists and why the round trip goes all the way to a row.
# - An unconfigured Label Studio serves an open registration form at
#   `/user/signup/` and hands the whole organization to whoever posts to it
#   first. The scenarios close that with the role's own variables, and the
#   stock-image control proves the closing is the role's doing.
# - `Restart=always` makes `systemctl is-active` say `active` for a container
#   that is crash-looping, so the restart counter is watched at the end.

- name: Load the Label Studio role defaults
  # Role defaults are not in scope in a verify play, but the version Renovate
  # bumps lives in them and the running container is checked against it below.
  # Only leaf literals may be read out of this - anything Jinja-derived would be
  # resolved against an empty namespace - and never a value a scenario tunes,
  # which this file takes from the scenario's group_vars instead.
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: labelstudio_defaults

- name: Read the Label Studio container the role created
  ansible.builtin.command:
    cmd: "docker container inspect {{ labelstudio_molecule_container }}"
  register: labelstudio_container_raw
  changed_when: false

- name: Make sense of the Label Studio container
  ansible.builtin.set_fact:
    labelstudio_container: "{{ (labelstudio_container_raw.stdout | from_json)[0] }}"

# ----------------------------------------------------------------------
# The negative control that runs alongside everything else
# ----------------------------------------------------------------------

# Started here and questioned near the end, so that its minute of start-up
# overlaps the waiting the role's own instance needs anyway. It is the same
# image with none of the role's configuration, which is the only way to show
# that the refusals asserted below belong to the role rather than to Label
# Studio. It gets no data mount: it keeps its database inside its own
# container, where it cannot touch the role's.
#
# A failed verify leaves this container behind, and `molecule verify` is worth
# being able to run again without a name conflict, so any leftover goes first.
- name: Remove any leftover unconfigured Label Studio
  ansible.builtin.command:
    cmd: "docker rm --force {{ labelstudio_verify_stock_container }}"
  changed_when: true
  failed_when: false

- name: Start a Label Studio with none of the role's configuration
  ansible.builtin.command:
    cmd: >-
      docker run --detach
      --name {{ labelstudio_verify_stock_container }}
      --publish 127.0.0.1:{{ labelstudio_molecule_stock_port }}:8080
      {{ labelstudio_container.Config.Image }}
  changed_when: true

# ----------------------------------------------------------------------
# The unit is up and Label Studio is answering
# ----------------------------------------------------------------------

- name: Wait for the Label Studio systemd service to become active (up to 180s)
  ansible.builtin.systemd_service:
    name: labelstudio.service
  register: labelstudio_service
  until: labelstudio_service.status.ActiveState == 'active'
  retries: 36
  delay: 5

- name: Assert the Label Studio systemd service is active
  ansible.builtin.assert:
    that: labelstudio_service.status.ActiveState == 'active'
    fail_msg: "labelstudio.service is not active ({{ labelstudio_service.status.ActiveState }})"
    success_msg: "labelstudio.service is active"

- name: Retrieve the Label Studio service log for debugging
  when: labelstudio_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl -xeu labelstudio.service
  changed_when: false

# Label Studio sends an anonymous visitor to its login page. `follow_redirects:
# none` keeps that honest: a role that had installed nothing would leave this
# waiting until it gave up, and an app that answered 200 to every path would be
# caught by the Location header rather than passing on the status alone.
- name: Wait for Label Studio to redirect an anonymous visitor to its login page (up to 10m)
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/"
    follow_redirects: none
    status_code: [200, 302, 502, 503]
  register: labelstudio_root
  until: labelstudio_root.status == 302
  retries: 120
  delay: 5

- name: Assert Label Studio sends anonymous visitors to its login page
  ansible.builtin.assert:
    that:
      - labelstudio_root.status == 302
      - labelstudio_root.location | default('') is search('/user/login/$')
    fail_msg: >-
      `GET /` answered {{ labelstudio_root.status }} pointing at
      {{ labelstudio_root.location | default('nowhere') }}, which is not the login redirect
      a running Label Studio gives an anonymous visitor
    success_msg: "Label Studio redirects anonymous visitors to {{ labelstudio_root.location }}"

# ----------------------------------------------------------------------
# The database is genuinely reachable, and the version is the pinned one
# ----------------------------------------------------------------------

# The Django trap, closed explicitly. This is the same image the role runs,
# pointed at a Postgres host that does not resolve, and it does not get as far
# as serving a login page: `_apply_database_migrations()` runs before the
# listener opens, so it dies with `django.db.utils.OperationalError`. That is
# what makes every answer above evidence of a working database rather than of a
# template rendering.
- name: Remove any leftover Label Studio without a database
  ansible.builtin.command:
    cmd: "docker rm --force {{ labelstudio_verify_nodb_container }}"
  changed_when: true
  failed_when: false

# `--kill-after` matters: a Label Studio that did come up ignores the SIGTERM
# that `timeout` proxies through `docker run` and would otherwise keep this
# task waiting forever instead of failing the assertion below.
- name: Run the Label Studio image against a database that does not exist
  ansible.builtin.command:
    cmd: >-
      timeout --kill-after=30 180
      docker run --rm --name {{ labelstudio_verify_nodb_container }}
      --env DJANGO_DB=default
      --env POSTGRE_HOST=this-host-does-not-resolve.invalid
      --env POSTGRE_NAME=labelstudio
      --env POSTGRE_USER=labelstudio
      --env POSTGRE_PASSWORD=labelstudio
      {{ labelstudio_container.Config.Image }}
  register: labelstudio_nodb_control
  changed_when: true
  failed_when: false

- name: Remove the Label Studio without a database
  ansible.builtin.command:
    cmd: "docker rm --force {{ labelstudio_verify_nodb_container }}"
  changed_when: true
  failed_when: false

- name: Assert Label Studio cannot serve anything without a reachable database
  ansible.builtin.assert:
    # 0 would mean it ran to completion, and 124 or 137 that `timeout` had to
    # stop a container which was happily running. Any of them would mean a Label
    # Studio can answer while its database is unreachable, and every check here
    # would be unable to tell a working install from a broken one.
    that:
      - labelstudio_nodb_control.rc not in [0, 124, 137]
      - "'OperationalError' in (labelstudio_nodb_control.stderr | default('') ~ labelstudio_nodb_control.stdout | default(''))"
    fail_msg: >-
      The Label Studio image survived an unreachable database
      (rc={{ labelstudio_nodb_control.rc }}), so answering on HTTP proves nothing about
      the database this scenario configured
    success_msg: >-
      Label Studio dies on an unreachable database (rc={{ labelstudio_nodb_control.rc }},
      OperationalError), so the instance answering above has a database that works

- name: Ask Label Studio which version it is
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/version"
    return_content: true
    status_code: [200]
  register: labelstudio_version_page

- name: Make sense of the version Label Studio reports
  ansible.builtin.set_fact:
    labelstudio_reported_version: "{{ labelstudio_version_page.content | regex_search('\"release\": \"([^\"]+)\"', '\\1') | first | default('') }}"

# `/version` is served by the running process out of its own package metadata,
# so comparing it with the leaf literal Renovate bumps ties what is actually
# serving to what the role claims to install. The image tag is checked too, so
# that a stale container left behind by an earlier run cannot pass for this one.
- name: Assert the running Label Studio is the version this role installs
  ansible.builtin.assert:
    that:
      - labelstudio_reported_version == labelstudio_defaults.labelstudio_version
      - (labelstudio_container.Config.Image | split(':') | last) == labelstudio_defaults.labelstudio_version
    fail_msg: >-
      The running Label Studio reports {{ labelstudio_reported_version | default('nothing') }}
      out of image {{ labelstudio_container.Config.Image }}, but `labelstudio_version` pins
      {{ labelstudio_defaults.labelstudio_version }}
    success_msg: >-
      The running Label Studio reports itself as {{ labelstudio_reported_version }}, out of
      {{ labelstudio_container.Config.Image }}, which is what `labelstudio_version` pins

# ----------------------------------------------------------------------
# `labelstudio_container_http_port` reaches the process, not just the labels
# ----------------------------------------------------------------------

# Every answer above already arrived on this port, through a mapping whose
# container-side end is `labelstudio_container_http_port`. If that variable only
# reached the port mapping and the Traefik label - as it did before `PORT` was
# added to the env file - a scenario that picks anything other than Label
# Studio's own default of 8080 could not have answered at all.
- name: Assert the Label Studio container was told which port to listen on
  ansible.builtin.assert:
    that:
      - ('PORT=' ~ labelstudio_container_http_port) in labelstudio_container.Config.Env
      - (labelstudio_container.Config.Env | select('match', '^PORT=') | list | length) == 1
    fail_msg: >-
      The container's environment does not carry PORT={{ labelstudio_container_http_port }}:
      {{ labelstudio_container.Config.Env | select('match', '^(PORT|LABEL_STUDIO_PORT)=') | list }}
    success_msg: >-
      Label Studio was handed PORT={{ labelstudio_container_http_port }} and is answering
      there, so `labelstudio_container_http_port` reaches the process

# ----------------------------------------------------------------------
# Nobody gets in without the credentials the role configured
# ----------------------------------------------------------------------

- name: Ask Label Studio for a list of projects without credentials
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/api/projects"
    status_code: [401]
  register: labelstudio_anonymous

- name: Fetch the Label Studio login page
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/user/login/"
    return_content: true
    status_code: [200]
  register: labelstudio_login_page

- name: Take the CSRF token out of the Label Studio login page
  ansible.builtin.set_fact:
    labelstudio_login_form_token: "{{ labelstudio_login_page.content | regex_search('name=\"csrfmiddlewaretoken\" value=\"([^\"]+)\"', '\\1') | first }}"
    labelstudio_login_cookie_token: "{{ labelstudio_login_page.cookies.csrftoken }}"

# Django answers a rejected login with the login page itself (200) rather than
# the redirect an accepted one gets, and hands out an anonymous session either
# way - so the cookie is not the tell, and is checked below instead.
- name: Log in to Label Studio with the wrong password
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/user/login/"
    method: POST
    body_format: form-urlencoded
    body:
      csrfmiddlewaretoken: "{{ labelstudio_login_form_token }}"
      email: "{{ labelstudio_molecule_admin_email }}"
      password: "not-{{ labelstudio_molecule_admin_password }}"
    headers:
      Cookie: "csrftoken={{ labelstudio_login_cookie_token }}"
    follow_redirects: none
    status_code: [200, 302]
  register: labelstudio_bad_login

- name: Ask Label Studio who the rejected login is
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/api/current-user/whoami"
    headers:
      Cookie: "{{ labelstudio_bad_login.set_cookie | default('') | regex_search('sessionid=[^;]+') | default('sessionid=none', true) }}"
    status_code: [200, 401]
  register: labelstudio_bad_login_whoami

- name: Assert Label Studio turns away everyone who cannot prove who they are
  ansible.builtin.assert:
    that:
      - labelstudio_anonymous.status == 401
      - labelstudio_bad_login.status == 200
      - labelstudio_bad_login_whoami.status == 401
    fail_msg: >-
      Label Studio let something through: anonymous API call {{ labelstudio_anonymous.status }},
      wrong password {{ labelstudio_bad_login.status }}, and the session it handed the wrong
      password identifies as {{ labelstudio_bad_login_whoami.status }}
    success_msg: >-
      Label Studio answers anonymous API calls with 401, does not redirect a wrong password
      onwards, and the session it leaves behind is nobody

# ----------------------------------------------------------------------
# The administrator the role configured exists, and can be logged in as
# ----------------------------------------------------------------------

# This account appears nowhere in Label Studio's own defaults. It exists only
# because `labelstudio_environment_variables_username` and `_password` were
# rendered into the env file and read by the process at first start. Logging in
# as it is what proves the rendered configuration reached the running process,
# rather than merely landing in a file on disk.
- name: Log in to Label Studio as the administrator the role configured
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/user/login/"
    method: POST
    body_format: form-urlencoded
    body:
      csrfmiddlewaretoken: "{{ labelstudio_login_form_token }}"
      email: "{{ labelstudio_molecule_admin_email }}"
      password: "{{ labelstudio_molecule_admin_password }}"
    headers:
      Cookie: "csrftoken={{ labelstudio_login_cookie_token }}"
    follow_redirects: none
    status_code: [302]
  register: labelstudio_login

# `uri` reports `set_cookie` as a single header even when the response carried
# several, and Django answers a login with two - so only the last one, the
# session, can be read out of here. The CSRF token from the login page is
# carried forward instead: Django checks the submitted token against the
# `csrftoken` cookie of the same request, and both of those are ours to send.
- name: Keep the Label Studio session
  ansible.builtin.set_fact:
    labelstudio_session_cookie: "{{ labelstudio_login.set_cookie | regex_search('sessionid=[^;]+') }}"

- name: Ask Label Studio who the accepted login is
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/api/current-user/whoami"
    headers:
      Cookie: "{{ labelstudio_session_cookie }}"
    status_code: [200]
  register: labelstudio_whoami

- name: Assert Label Studio knows the administrator the role's configuration created
  ansible.builtin.assert:
    that:
      - labelstudio_login.status == 302
      - labelstudio_whoami.json.email == labelstudio_molecule_admin_email
    fail_msg: >-
      Logging in as {{ labelstudio_molecule_admin_email }} produced
      {{ labelstudio_login.status }} and a session belonging to
      {{ labelstudio_whoami.json.email | default('nobody') }}, so
      `labelstudio_environment_variables_username`/`_password` did not reach the process
    success_msg: >-
      Label Studio issued a session to {{ labelstudio_whoami.json.email }}, the administrator
      `labelstudio_environment_variables_username` names, so the env file reached the process

# ----------------------------------------------------------------------
# Sign-ups are closed, and that is the role's doing
# ----------------------------------------------------------------------

- name: Fetch the Label Studio sign-up page
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/user/signup/"
    return_content: true
    status_code: [200]
  register: labelstudio_signup_page

- name: Try to sign up for an account on the Label Studio the role installed
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/user/signup/"
    method: POST
    body_format: form-urlencoded
    body:
      csrfmiddlewaretoken: "{{ labelstudio_signup_page.content | regex_search('name=\"csrfmiddlewaretoken\" value=\"([^\"]+)\"', '\\1') | first }}"
      email: "{{ labelstudio_molecule_intruder_email }}"
      password: "{{ labelstudio_molecule_intruder_password }}"
    headers:
      Cookie: "csrftoken={{ labelstudio_signup_page.cookies.csrftoken }}"
    follow_redirects: none
    status_code: [200, 302, 403]
  register: labelstudio_signup_attempt

- name: Wait for the unconfigured Label Studio to come up (up to 8m)
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_stock_url }}/user/signup/"
    return_content: true
    status_code: [200, 502, 503]
  register: labelstudio_stock_signup_page
  until: labelstudio_stock_signup_page.status == 200
  retries: 96
  delay: 5

# The control that makes the refusal above mean something. The same image, the
# same request, no role configuration - and it hands out an account. Without
# this, a 403 could just as well have come from a Label Studio that was broken,
# or from a version that had closed sign-ups on its own.
- name: Sign up for an account on the Label Studio the role did not configure
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_stock_url }}/user/signup/"
    method: POST
    body_format: form-urlencoded
    body:
      csrfmiddlewaretoken: "{{ labelstudio_stock_signup_page.content | regex_search('name=\"csrfmiddlewaretoken\" value=\"([^\"]+)\"', '\\1') | first }}"
      email: "{{ labelstudio_molecule_intruder_email }}"
      password: "{{ labelstudio_molecule_intruder_password }}"
    headers:
      Cookie: "csrftoken={{ labelstudio_stock_signup_page.cookies.csrftoken }}"
    follow_redirects: none
    status_code: [200, 302, 403]
  register: labelstudio_stock_signup_attempt

- name: Assert the role is what closes Label Studio's sign-up form
  ansible.builtin.assert:
    that:
      - labelstudio_signup_attempt.status == 403
      - labelstudio_stock_signup_attempt.status == 302
    fail_msg: >-
      A passer-by signing up got {{ labelstudio_signup_attempt.status }} from the Label Studio
      this role installed and {{ labelstudio_stock_signup_attempt.status }} from the same image
      unconfigured; the role is meant to refuse (403) where the stock image accepts (302)
    success_msg: >-
      The unconfigured image hands {{ labelstudio_molecule_intruder_email }} an account (302)
      while the role's instance refuses it (403), so
      `labelstudio_environment_variables_disable_signup_without_link` is what closed the door

- name: Remove the unconfigured Label Studio
  ansible.builtin.command:
    cmd: "docker rm --force {{ labelstudio_verify_stock_container }}"
  changed_when: true

# ----------------------------------------------------------------------
# A round trip through the API, to be looked for in the database afterwards
# ----------------------------------------------------------------------

- name: Create a project in Label Studio
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/api/projects"
    method: POST
    body_format: json
    body:
      title: "{{ labelstudio_molecule_project_title }}"
      description: "{{ labelstudio_molecule_project_description }}"
    headers:
      Cookie: "{{ labelstudio_session_cookie }}; csrftoken={{ labelstudio_login_cookie_token }}"
      X-CSRFToken: "{{ labelstudio_login_cookie_token }}"
    status_code: [201]
  register: labelstudio_created_project

- name: Read the project back out of Label Studio
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/api/projects/{{ labelstudio_created_project.json.id }}"
    headers:
      Cookie: "{{ labelstudio_session_cookie }}"
    status_code: [200]
  register: labelstudio_read_project

# The same read for an id nobody ever created. Without it, an API that answered
# every project request with whatever it had would look exactly like one that
# stored what it was given.
- name: Ask Label Studio for a project that was never created
  ansible.builtin.uri:
    url: "{{ labelstudio_verify_url }}/api/projects/424242"
    headers:
      Cookie: "{{ labelstudio_session_cookie }}"
    status_code: [404]
  register: labelstudio_read_absent

- name: Assert Label Studio stored and returned what it was given
  ansible.builtin.assert:
    that:
      - labelstudio_read_project.json.title == labelstudio_molecule_project_title
      - labelstudio_read_project.json.description == labelstudio_molecule_project_description
      - labelstudio_read_project.json.created_by.email == labelstudio_molecule_admin_email
      - labelstudio_read_absent.status == 404
    fail_msg: >-
      The round trip through Label Studio's API did not come back intact:
      {{ labelstudio_read_project.json | string | truncate(400) }}
    success_msg: >-
      Label Studio stored project {{ labelstudio_created_project.json.id }}
      ({{ labelstudio_molecule_project_title }}) for {{ labelstudio_molecule_admin_email }},
      returns it when asked, and 404s for an id nobody created

# ----------------------------------------------------------------------
# Nothing was quietly restarting while all of that was being checked
# ----------------------------------------------------------------------

# `Restart=always` means the unit reads `active` while it is crash-looping, and
# a loop is exactly what a Label Studio that cannot reach its database would
# settle into - it runs its migrations before opening a listener. The window
# starts here, with everything already answering, because restarts from before
# this point say nothing.
- name: Sample the Label Studio restart counter
  ansible.builtin.systemd_service:
    name: labelstudio.service
  register: labelstudio_restarts_before

# Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
# tick at least once inside the window.
- name: Watch the Label Studio service for 45 seconds
  ansible.builtin.pause:
    seconds: 45

- name: Sample the Label Studio restart counter again
  ansible.builtin.systemd_service:
    name: labelstudio.service
  register: labelstudio_restarts_after

- name: Assert Label Studio did not restart while it was up
  ansible.builtin.assert:
    that: labelstudio_restarts_after.status.NRestarts == labelstudio_restarts_before.status.NRestarts
    fail_msg: >-
      Label Studio restarted while it was supposedly up
      ({{ labelstudio_restarts_before.status.NRestarts }} to
      {{ labelstudio_restarts_after.status.NRestarts }}), so `active` was hiding a crash loop
    success_msg: >-
      Label Studio did not restart over 45 seconds of watching
      (restarts so far: {{ labelstudio_restarts_after.status.NRestarts }})

- name: Show the shared Label Studio verification summary
  ansible.builtin.debug:
    msg:
      - "systemd: {{ labelstudio_service.status.ActiveState }}, restarts {{ labelstudio_restarts_after.status.NRestarts }}"
      - "unreachable database: exited rc={{ labelstudio_nodb_control.rc }}"
      - "anonymous visitor: {{ labelstudio_root.status }} to {{ labelstudio_root.location }} on port {{ labelstudio_container_http_port }}"
      - "version: {{ labelstudio_reported_version }} from {{ labelstudio_container.Config.Image }}"
      - "refusals: anonymous API {{ labelstudio_anonymous.status }}, wrong password {{ labelstudio_bad_login.status }} (whoami {{ labelstudio_bad_login_whoami.status }})"
      - "sign-up: role {{ labelstudio_signup_attempt.status }}, unconfigured image {{ labelstudio_stock_signup_attempt.status }}"
      - "administrator: {{ labelstudio_whoami.json.email }}"
      - "round trip: project {{ labelstudio_created_project.json.id }} '{{ labelstudio_read_project.json.title }}', absent id {{ labelstudio_read_absent.status }}"
