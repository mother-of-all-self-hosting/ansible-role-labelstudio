---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: labelstudio-${MOLECULE_DISTRO:-ubuntu2604}-postgres
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        labelstudio_debug_service_enabled: false

        # The container the role creates, named after `labelstudio_identifier`.
        labelstudio_molecule_container: labelstudio

        # The administrator that Label Studio creates at first start out of the
        # env file the role renders, and that verify.yml logs in as. It exists
        # nowhere in Label Studio's own defaults, so a successful login is proof
        # that the rendered configuration reached the running process.
        labelstudio_molecule_admin_email: molecule-admin@example.com
        labelstudio_molecule_admin_password: molecule-admin-password

        # The passer-by verify.yml tries to sign up as - on the role's instance,
        # which must refuse, and on an unconfigured one, which does not.
        labelstudio_molecule_intruder_email: molecule-intruder@example.com
        labelstudio_molecule_intruder_password: molecule-intruder-password

        # The project verify.yml round-trips through the API and then goes
        # looking for in the database this scenario configured. The description
        # differs per scenario, so a container left over from another one cannot
        # pass for this scenario's.
        labelstudio_molecule_project_title: molecule-probe-project
        labelstudio_molecule_project_description: molecule-round-trip-marker-postgres

        # Where a SQLite database would land, if this scenario used one. It must
        # not exist: Postgres is meant to be the only store.
        labelstudio_molecule_sqlite_path: /labelstudio/data/label_studio.sqlite3

        # The host port that verify.yml publishes its unconfigured control
        # instance on, alongside the role's own instance.
        labelstudio_molecule_stock_port: 8081

        # Variables for Label Studio
        labelstudio_uid: 1000
        labelstudio_gid: 1000
        labelstudio_scheme: http
        labelstudio_hostname: localhost
        labelstudio_container_labels_traefik_enabled: false
        labelstudio_container_http_host_bind_port: 8080

        # Label Studio's own default, stated rather than inherited, because
        # verify.yml runs outside the role and cannot see role defaults. The
        # `default` scenario is the one that moves this off 8080.
        labelstudio_container_http_port: 8080

        # Closes the open registration form that an unconfigured Label Studio
        # serves, and names the account that owns the instance instead.
        labelstudio_environment_variables_disable_signup_without_link: true
        labelstudio_environment_variables_username: "{{ labelstudio_molecule_admin_email }}"
        labelstudio_environment_variables_password: "{{ labelstudio_molecule_admin_password }}"

        # Variables required for Label Studio to connect to the Postgres database
        labelstudio_database_type: postgres
        labelstudio_database_hostname: "{{ postgres_connection_hostname }}"
        labelstudio_database_port: "{{ postgres_connection_port }}"
        labelstudio_database_username: my_database_username
        labelstudio_database_password: my_database_password
        labelstudio_database_name: labelstudio
        labelstudio_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_network: "{{ labelstudio_container_network }}"
        postgres_managed_databases: |
          {{
            [{
              'name': labelstudio_database_name,
              'username': labelstudio_database_username,
              'password': labelstudio_database_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
